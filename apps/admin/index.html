<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>À la carte Admin</title>
    <script>
      // Pre-hydration theme: set .light/.dark class on <html> before React mounts.
      // ponytail: matches the existing localStorage contract; expand if system-only preference is needed.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var scheme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(scheme);
        } catch (_) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
