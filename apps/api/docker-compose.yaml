services:
  api:
    image: cosmtrek/air:latest
    restart: unless-stopped
    working_dir: /project
    ports:
      - 8080:8080
    volumes:
      - ./:/project/
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    networks:
      - alacarte-network
      - default

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: rest_api
      POSTGRES_PASSWORD: rest_api
      POSTGRES_DB: rest_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rest_api -d rest_api"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alacarte-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_VOLUMES: /data
    command: minio server --console-address :9001
    healthcheck:
      test: "/usr/bin/mc alias set minio http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && /usr/bin/mc admin info minio"
      interval: 30s
      timeout: 10s
      retries: 4
    volumes:
      - minio_data:/data
    networks:
      - alacarte-network
      - default

  create-bucket:
    image: minio/mc:latest
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing minio/alacarte-images;
      /usr/bin/mc anonymous set download minio/alacarte-images;
      "
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - alacarte-network

volumes:
  postgres_data:
    name: alacarte-postgres-data
  minio_data:
    name: alacarte-minio-data
